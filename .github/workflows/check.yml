# The one-command check on every push, the way the jury runs it:
#  - plain Python 3.11 (the case's version) and 3.12: `python -m auditgym check`, then the shipped
#    episodes and trajectories must rebuild byte for byte;
#  - the Docker image, built from the pinned digest and run the way the jury runs it (`--network
#    none`, 2 CPUs, 4 GB): the fast check (the image's default command), the full one, and the
#    judge_adapter entry points of the official 20.11 checks (demo of the four baselines, 20 pairs).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: python -m auditgym check
        run: python -m auditgym check
      - name: shipped episodes rebuild byte for byte
        run: |
          python -m tools.episodes --out episodes
          git diff --exit-code --stat -- episodes
      - name: shipped trajectories rebuild byte for byte
        run: |
          python -m tools.trajectories --out trajectories.jsonl --oracle-out runs/trajectories.oracle.jsonl
          git diff --exit-code --stat -- trajectories.jsonl

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t auditgym .
      - name: docker run with the jury limits (default command, fast check)
        run: docker run --rm --network none --cpus 2 --memory 4g auditgym
      - name: judge_adapter in the container with the jury limits (import from /app, four baselines)
        run: docker run --rm --network none --cpus 2 --memory 4g -w /tmp auditgym python -c "import sys; sys.path.insert(0, '/app'); import judge_adapter; raise SystemExit(judge_adapter.main(['--demo']))"
      - name: judge_adapter paired checks P01-P20 in the container with the jury limits
        run: docker run --rm --network none --cpus 2 --memory 4g auditgym python -m tools.adapter_pairs
      - name: docker run with the jury limits, full check
        run: docker run --rm --network none --cpus 2 --memory 4g auditgym python -m auditgym check --full
